<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2d42"/>
      <stop offset="1" stop-color="#1a1b2e"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- terminal prompt -->
  <text x="24" y="80" font-family="Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#4ec9b0">&gt;_</text>
  <!-- pin -->
  <g transform="translate(86,20) rotate(45)">
    <circle cx="10" cy="10" r="10" fill="#e07a5f"/>
    <rect x="7" y="18" width="6" height="16" rx="3" fill="#e07a5f"/>
  </g>
</svg>
